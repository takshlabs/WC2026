name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --registry https://registry.npmjs.org

      - name: Generate OG image (SVG → PNG)
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 public/og.svg -o public/og.png
          echo "og.png: $(wc -c < public/og.png) bytes"

      - name: Build
        run: npm run build
        env:
          VITE_FOOTBALL_DATA_KEY: ${{ secrets.VITE_FOOTBALL_DATA_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DB_URL: ${{ secrets.VITE_FIREBASE_DB_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Preserve live data files from gh-pages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          for f in live-scores.json wc2026-stats.json match-events.json match-details.json wc2026-schedule.json wc2026-news.json; do
            git show origin/gh-pages:$f > dist/$f 2>/dev/null && echo "preserved $f" || echo "skipped $f (not found)"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # keep_files intentionally removed — old hashed assets accumulate and bust the size limit.
          # Live JSON files are explicitly copied from gh-pages above instead.