name: Update Live Scores

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (public repo = free/unlimited minutes)
  workflow_dispatch:          # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch today's scores from football-data.org
        env:
          FD_KEY: ${{ secrets.VITE_FOOTBALL_DATA_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          HTTP=$(curl -s -w '%{http_code}' -o live-scores.json \
            -H "X-Auth-Token: $FD_KEY" \
            "https://api.football-data.org/v4/competitions/2000/matches?dateFrom=$TODAY&dateTo=$TODAY")
          echo "API HTTP $HTTP for $TODAY"
          [ "$HTTP" = "200" ] || echo '{"matches":[]}' > live-scores.json

      - name: Commit and push if scores changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-scores.json
          if git diff --cached --quiet; then
            echo "No score changes — skipping commit"
          else
            git commit -m "chore: update live scores [skip ci]"
            git push
          fi
