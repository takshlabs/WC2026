name: Update Live Scores

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # ── Step 1: Refresh full schedule from fd.org (≤1× per 12 h) ────────
      # fd.org provides the authoritative 104-match schedule including TBD
      # knockout slots that fill in as the tournament progresses.
      # ESPN is used for all live data; fd.org is only called for schedule.
      - name: Refresh WC2026 schedule from fd.org
        env:
          FD_KEY: ${{ secrets.VITE_FOOTBALL_DATA_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys
          from datetime import datetime, timezone

          SCHEDULE_FILE = 'wc2026-schedule.json'
          MAX_AGE_HOURS = 12

          def is_stale():
            if not os.path.exists(SCHEDULE_FILE):
              return True
            try:
              with open(SCHEDULE_FILE) as f:
                s = json.load(f)
              fa = s.get('_fetched_at')
              if not fa:
                return True
              age_h = (datetime.now(timezone.utc) - datetime.fromisoformat(fa)).total_seconds() / 3600
              return age_h > MAX_AGE_HOURS
            except Exception:
              return True

          if not is_stale():
            print('Schedule fresh — skipping fd.org call')
            raise SystemExit(0)

          FD_KEY = os.environ.get('FD_KEY', '')
          print('Fetching full WC2026 schedule from fd.org...')
          r = requests.get(
            'https://api.football-data.org/v4/competitions/2000/matches',
            headers={'X-Auth-Token': FD_KEY}, timeout=30
          )
          print(f'fd.org → HTTP {r.status_code}')
          if r.status_code != 200:
            print(f'WARNING: fd.org returned {r.status_code} — keeping existing schedule', file=sys.stderr)
            raise SystemExit(0)

          data = r.json()
          data['_fetched_at'] = datetime.now(timezone.utc).isoformat()
          with open(SCHEDULE_FILE, 'w') as f:
            json.dump(data, f)

          total = len(data.get('matches', []))
          print(f'Schedule saved: {total} matches → {SCHEDULE_FILE}')
          PYEOF

      # ── Step 2: ESPN live scores + events + merge ─────────────────────────
      # ESPN unofficial API (site.api.espn.com) provides:
      #   - Live scores, statuses, live clock — from scoreboard (3 date queries)
      #   - Goals, cards, assists — from summary per match
      # No API key, no rate limit. Replaces the live-data role of fd.org.
      - name: Install Python deps
        run: pip install requests -q

      - name: Fetch live data from ESPN and merge into live-scores.json
        run: |
          python3 << 'PYEOF'
          import requests, json, re, time, os, sys, unicodedata
          from datetime import datetime, timedelta, timezone

          ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world'
          SCHEDULE_FILE = 'wc2026-schedule.json'

          # ── Name normalisation (NFKD-safe, verbatim from previous version) ──
          ESPN_ALIASES = {
            'unitedstates': 'usa', 'usa': 'usa', 'usmnt': 'usa',
            'korea': 'southkorea', 'southkorea': 'southkorea',
            'korearepublic': 'southkorea', 'republicofkorea': 'southkorea',
            'iran': 'iran', 'islamicrepublicofiran': 'iran',
            'ivorycoast': 'cotedivoire', 'cotedivoire': 'cotedivoire',
            'drcongo': 'drcongo', 'congodrc': 'drcongo', 'congord': 'drcongo',
            'democraticrepublicofthecongo': 'drcongo',
            'democraticrepublicofcongo': 'drcongo',
            'bosniaandherzegovina': 'bosnia', 'bosniaherzegovina': 'bosnia',
            'bosnia': 'bosnia',
            'czechrepublic': 'czechia', 'czechia': 'czechia',
            'saudiarabia': 'saudiarabia',
            'southafrica': 'southafrica',
            'newzealand': 'newzealand',
            'turkey': 'turkey', 'turkiye': 'turkey',
            'northmacedonia': 'northmacedonia', 'macedonia': 'northmacedonia',
            'capeverde': 'capeverde',
            'republicofireland': 'ireland', 'ireland': 'ireland',
            'trinidadandtobago': 'trinidadtobago', 'trinidadtobago': 'trinidadtobago',
            'antiguaandbarbuda': 'antiguabarbuda', 'antiguabarbuda': 'antiguabarbuda',
            'papuanewguinea': 'papuanewguinea',
          }
          def norm(s):
            """Unicode-safe normaliser: NFKD decompose → strip non-alpha → alias lookup."""
            nfkd = unicodedata.normalize('NFKD', (s or '').lower())
            raw  = re.sub(r'[^a-z]', '', nfkd)
            return ESPN_ALIASES.get(raw, raw)

          def parse_minute(clock_str):
            # ESPN format: "45'+5'" (injury time) or "31'" (regular)
            m = re.match(r"(\d+)'?\+(\d+)", clock_str or '')
            if m: return int(m.group(1)), int(m.group(2))
            m = re.match(r"(\d+)", clock_str or '')
            if m: return int(m.group(1)), None
            return 0, None

          def espn_get(path, params=None):
            r = requests.get(f'{ESPN}/{path}', params=params, timeout=20)
            r.raise_for_status()
            return r.json()

          # ── Load schedule (fd.org base) ────────────────────────────────────
          # Bootstrap fallback: if schedule file is absent, seed from
          # existing live-scores.json so we never lose the full match list.
          schedule = None
          if os.path.exists(SCHEDULE_FILE):
            try:
              with open(SCHEDULE_FILE) as f:
                schedule = json.load(f)
              print(f'Schedule loaded: {len(schedule.get("matches",[]))} matches')
            except Exception as e:
              print(f'WARNING: schedule load failed: {e}', file=sys.stderr)

          if not schedule or not schedule.get('matches'):
            if os.path.exists('live-scores.json'):
              print('Bootstrap: seeding schedule from existing live-scores.json')
              with open('live-scores.json') as f:
                schedule = json.load(f)
            else:
              print('ERROR: no schedule and no live-scores.json — cannot proceed', file=sys.stderr)
              raise SystemExit(1)

          matches = schedule.get('matches', [])

          # ── Cache versioning ────────────────────────────────────────────────
          # Increment CACHE_VERSION when parse logic changes — auto-evicts stale
          # v1: initial  v2: fixed parse_minute "45'+5'" format  v3: ESPN-only live
          CACHE_VERSION = 3

          try:
            with open('match-events.json') as f:
              cache = json.load(f)
            if cache.get('__version__') != CACHE_VERSION:
              print(f'Cache v{cache.get("__version__")} → v{CACHE_VERSION}: clearing for re-fetch')
              cache = {'__version__': CACHE_VERSION}
          except Exception:
            cache = {'__version__': CACHE_VERSION}

          # ── ESPN live map: yesterday + today + tomorrow ─────────────────────
          # Scores keyed by norm(teamName) to avoid home/away position flip
          # (ESPN and fd.org can disagree on which side is "home" at neutral venues)
          now_utc = datetime.now(timezone.utc)
          espn_dates = [
            (now_utc - timedelta(days=1)).strftime('%Y%m%d'),
            now_utc.strftime('%Y%m%d'),
            (now_utc + timedelta(days=1)).strftime('%Y%m%d'),
          ]

          # espn_live_map[norm(h)_norm(a)] = {
          #   status, scoreByName{norm(name): score}, displayClock, espnId }
          espn_live_map = {}

          for date_str in espn_dates:
            try:
              data = espn_get('scoreboard', params={'dates': date_str})
              events_on_date = data.get('events', [])
              print(f'ESPN scoreboard {date_str}: {len(events_on_date)} events')
              for event in events_on_date:
                comps      = event.get('competitions', [{}])[0]
                comps_list = comps.get('competitors', [])
                h_comp = next((c for c in comps_list if c.get('homeAway') == 'home'), {})
                a_comp = next((c for c in comps_list if c.get('homeAway') == 'away'), {})
                h_name = h_comp.get('team', {}).get('displayName', '')
                a_name = a_comp.get('team', {}).get('displayName', '')
                if not h_name or not a_name:
                  continue

                # Scores by team name — immune to position ordering differences
                score_by_name = {}
                for c in comps_list:
                  n = c.get('team', {}).get('displayName', '')
                  if n:
                    score_by_name[norm(n)] = int(c.get('score', 0) or 0)

                status_obj    = comps.get('status', {})
                state         = status_obj.get('type', {}).get('state', '')
                status_name   = status_obj.get('type', {}).get('name', '')
                display_clock = status_obj.get('displayClock', '')

                # Translate ESPN state → fd.org-compatible status strings
                if state == 'post':
                  fd_status = 'FINISHED'
                elif state == 'in':
                  fd_status = 'HALFTIME' if 'HALFTIME' in status_name else 'IN_PLAY'
                else:
                  fd_status = 'TIMED'

                k = f'{norm(h_name)}_{norm(a_name)}'
                entry = {
                  'status':       fd_status,
                  'scoreByName':  score_by_name,
                  'displayClock': display_clock,
                  'espnId':       event['id'],
                }
                espn_live_map[k] = entry
                print(f'  [{fd_status}] {h_name} {score_by_name.get(norm(h_name),"-")}'
                      f'–{score_by_name.get(norm(a_name),"-")} {a_name}')
              time.sleep(0.4)
            except Exception as e:
              print(f'WARNING ESPN scoreboard {date_str}: {e}', file=sys.stderr)

          print(f'ESPN live map: {len(espn_live_map)} entries')

          # ── Helper: look up ESPN entry for a schedule match ────────────────
          def get_espn_entry(m):
            h = m.get('homeTeam', {}).get('name', '')
            a = m.get('awayTeam', {}).get('name', '')
            entry = espn_live_map.get(f'{norm(h)}_{norm(a)}')
            if entry is None:
              # ESPN occasionally lists home/away reversed
              entry = espn_live_map.get(f'{norm(a)}_{norm(h)}')
            return entry

          # ── Cache healing ──────────────────────────────────────────────────
          healed = []
          for m in matches:
            mid   = str(m['id'])
            entry = get_espn_entry(m)
            if not entry:
              continue
            sbn     = entry.get('scoreByName', {})
            h_score = sbn.get(norm(m.get('homeTeam', {}).get('name', '')), 0)
            a_score = sbn.get(norm(m.get('awayTeam', {}).get('name', '')), 0)
            if (entry['status'] == 'FINISHED'
                and mid in cache
                and not cache[mid].get('goals')
                and not cache[mid].get('bookings')
                and h_score + a_score > 0):
              del cache[mid]
              healed.append(f"{m.get('homeTeam',{}).get('name','?')} vs {m.get('awayTeam',{}).get('name','?')}")
          if healed:
            print(f'Cache healing: evicted {len(healed)} poisoned entries → {healed}')

          # ── Which matches need event fetch ─────────────────────────────────
          LIVE_STATUSES = ('IN_PLAY', 'PAUSED', 'HALFTIME')
          need_finished = [
            m for m in matches
            if (get_espn_entry(m) or {}).get('status') == 'FINISHED'
            and str(m['id']) not in cache
          ]
          need_live = [
            m for m in matches
            if (get_espn_entry(m) or {}).get('status') in LIVE_STATUSES
          ]
          need = need_finished + need_live
          print(f'Events to fetch: {len(need_finished)} new finished + {len(need_live)} live')

          live_events = {}

          if need:
            # ── parse_espn_events (preserved verbatim) ────────────────────────
            def parse_espn_events(summary, m):
              """Parse keyEvents[] → goals/bookings. Verbatim from prior version.
              Guarantees: no self-assists, no phantom ESPN duplicate goals,
              no null team IDs, OG team.id = scorer's team."""
              h_id   = m.get('homeTeam', {}).get('id')
              a_id   = m.get('awayTeam', {}).get('id')
              h_name = m.get('homeTeam', {}).get('name', '')
              a_name = m.get('awayTeam', {}).get('name', '')

              competitors = (summary.get('header', {})
                            .get('competitions', [{}])[0]
                            .get('competitors', []))
              espn_to_fdorg   = {}
              espn_name_to_id = {}
              for comp in competitors:
                ha        = comp.get('homeAway', '')
                espn_tid  = str(comp.get('id') or comp.get('team', {}).get('id', ''))
                disp_name = comp.get('team', {}).get('displayName', '')
                fdorg_id  = h_id if ha == 'home' else a_id if ha == 'away' else None
                if fdorg_id:
                  espn_to_fdorg[espn_tid] = fdorg_id
                  if disp_name:
                    espn_name_to_id[norm(disp_name)] = fdorg_id
              if h_name: espn_name_to_id[norm(h_name)] = h_id
              if a_name: espn_name_to_id[norm(a_name)] = a_id

              def resolve_team_id(event):
                espn_tid  = str(event.get('team', {}).get('id', ''))
                disp_name = event.get('team', {}).get('displayName', '')
                tid = espn_to_fdorg.get(espn_tid)
                if tid is None and disp_name:
                  tid = espn_name_to_id.get(norm(disp_name))
                return tid

              goals, bookings = [], []
              seen_goals = set()

              key_events = summary.get('keyEvents', [])
              if not key_events:
                key_events = (summary.get('header', {})
                             .get('competitions', [{}])[0]
                             .get('details', []))
                if key_events:
                  print(f'    [fallback] details ({len(key_events)} events)')
                else:
                  print(f'    [warn] keyEvents AND details both empty')

              for event in key_events:
                etype     = event.get('type', {}).get('type', '').lower()
                clock_str = event.get('clock', {}).get('displayValue', '')
                minute, inj = parse_minute(clock_str)
                team_id   = resolve_team_id(event)
                parts     = event.get('participants', [])

                if event.get('scoringPlay') or etype in ('goal', 'own-goal', 'penalty-goal', 'penalty'):
                  scorer_name = parts[0]['athlete'].get('displayName', '?') if parts else '?'
                  # Drop ESPN assist-tracking duplicates (participants[0]==participants[1])
                  if len(parts) >= 2 and parts[1]['athlete'].get('displayName', '') == scorer_name:
                    continue
                  assist_name = None
                  if len(parts) > 1 and etype != 'own-goal':
                    candidate = parts[1]['athlete'].get('displayName', '')
                    if candidate and candidate != scorer_name:
                      assist_name = candidate
                  goal_type = ('OWN_GOAL' if etype == 'own-goal'
                               else 'PENALTY' if 'penalty' in etype
                               else 'REGULAR')
                  dedup = (scorer_name, minute, inj, team_id, goal_type)
                  if dedup in seen_goals:
                    continue
                  seen_goals.add(dedup)
                  goals.append({
                    'minute': minute, 'injuryTime': inj, 'type': goal_type,
                    'scorer': {'name': scorer_name, 'shortName': scorer_name},
                    'assist': {'name': assist_name, 'shortName': assist_name} if assist_name else None,
                    'team':   {'id': team_id},
                  })

                elif etype in ('yellow-card', 'red-card', 'yellow-red-card'):
                  player_name = parts[0]['athlete'].get('displayName', '?') if parts else '?'
                  card_map = {
                    'yellow-card':     'YELLOW_CARD',
                    'red-card':        'RED_CARD',
                    'yellow-red-card': 'YELLOW_RED_CARD',
                  }
                  bookings.append({
                    'minute': minute,
                    'player': {'name': player_name, 'shortName': player_name},
                    'card': card_map.get(etype, 'YELLOW_CARD'),
                    'team': {'id': team_id},
                  })

              goals.sort(key=lambda g: g['minute'])
              bookings.sort(key=lambda b: b['minute'])
              return goals, bookings

            # ── Fetch events for each match ─────────────────────────────────
            for m in need:
              mid     = str(m['id'])
              entry   = get_espn_entry(m)
              espn_id = (entry or {}).get('espnId')
              is_live = (entry or {}).get('status') in LIVE_STATUSES
              h_name  = m.get('homeTeam', {}).get('name', '')
              a_name  = m.get('awayTeam', {}).get('name', '')

              if not espn_id:
                print(f'  [{mid}] {h_name} vs {a_name} — no ESPN ID in live map')
                continue

              try:
                time.sleep(0.8)
                summary   = espn_get('summary', params={'event': espn_id})
                ke_count  = len(summary.get('keyEvents', []))
                det_count = len(summary.get('header', {}).get('competitions', [{}])[0].get('details', []))
                print(f'    ESPN summary {espn_id}: keyEvents={ke_count}, details={det_count}')
                goals, bookings = parse_espn_events(summary, m)
                label = 'LIVE' if is_live else 'FT'
                print(f'  [{mid}][{label}] {h_name} vs {a_name}: {len(goals)} goals, {len(bookings)} cards')
                if is_live:
                  live_events[mid] = {'goals': goals, 'bookings': bookings}
                else:
                  cache[mid] = {'goals': goals, 'bookings': bookings}
              except Exception as e:
                print(f'  WARNING [{mid}] {h_name} vs {a_name}: {e}', file=sys.stderr)
                # DO NOT cache on error — allow retry on next run

          cache['__version__'] = CACHE_VERSION
          with open('match-events.json', 'w') as f:
            json.dump(cache, f, indent=2)
          entry_count = sum(1 for k in cache if k != '__version__')
          print(f'match-events.json v{CACHE_VERSION} — {entry_count} entries')

          # ── Merge: schedule + ESPN live + events → live-scores.json ────────
          all_events = {**{k: v for k, v in cache.items() if k != '__version__'},
                        **live_events}

          goal_total = live_count = 0
          for m in matches:
            entry = get_espn_entry(m)
            if entry:
              # Override status with ESPN (no more stale fd.org statuses)
              m['status'] = entry['status']

              # Scores by team name — safe against home/away position mismatch
              sbn     = entry.get('scoreByName', {})
              h_name  = m.get('homeTeam', {}).get('name', '')
              a_name  = m.get('awayTeam', {}).get('name', '')
              h_score = sbn.get(norm(h_name))
              a_score = sbn.get(norm(a_name))
              if h_score is not None and a_score is not None:
                m.setdefault('score', {})['fullTime'] = {'home': h_score, 'away': a_score}

              # Live clock — stored for future frontend use
              if entry.get('displayClock'):
                m['displayClock'] = entry['displayClock']

            # Attach events (goals + bookings)
            mid = str(m['id'])
            ev  = all_events.get(mid, {})
            m['goals']    = ev.get('goals', [])
            m['bookings'] = ev.get('bookings', [])
            goal_total   += len(m['goals'])
            if m.get('status') in ('IN_PLAY', 'PAUSED', 'HALFTIME'):
              live_count += 1

          with open('live-scores.json', 'w') as f:
            json.dump(schedule, f)

          total = len(matches)
          done  = sum(1 for m in matches if m.get('status') == 'FINISHED')
          print(f'live-scores.json — {total} matches, {done} finished, {live_count} live, {goal_total} goals')

          # Clean up ephemeral files
          if os.path.exists('live-events.json'):
            os.remove('live-events.json')
          PYEOF

      # ── Step 3: commit ─────────────────────────────────────────────────────
      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-scores.json match-events.json wc2026-schedule.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update live scores + events [skip ci]"
            git push
          fi
