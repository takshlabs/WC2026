name: Update Live Scores

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — public repo = unlimited free minutes
  workflow_dispatch:          # manual trigger from Actions tab
  workflow_run:               # also run immediately after every site deployment
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch matches + individual event details from football-data.org
        env:
          FD_KEY: ${{ secrets.VITE_FOOTBALL_DATA_KEY }}
        run: |
          # ── 1. Bulk matches fetch (scores, status, fixtures) ──────────────
          HTTP=$(curl -s -w '%{http_code}' -o all-matches.json \
            -H "X-Auth-Token: $FD_KEY" \
            "https://api.football-data.org/v4/competitions/2000/matches")
          echo "Bulk matches API → HTTP $HTTP"

          if [ "$HTTP" != "200" ]; then
            echo "WARNING: API returned $HTTP — preserving existing live-scores.json"
            rm -f all-matches.json
            [ -f live-scores.json ] || echo '{"matches":[]}' > live-scores.json
            exit 0
          fi

          # ── 2. Load or initialise the events cache ────────────────────────
          # match-events.json persists on gh-pages between runs so we never
          # re-fetch events for a match we already processed.
          [ -f match-events.json ] || echo '{}' > match-events.json

          # ── 3. For each newly-FINISHED match, fetch individual events ─────
          # The bulk endpoint does NOT include goals/bookings; the individual
          # /v4/matches/{id} endpoint does. We stay under the free-tier rate
          # limit (10 req/min) by sleeping 7 s between calls.
          FINISHED_IDS=$(jq -r '.matches[] | select(.status == "FINISHED") | .id' all-matches.json)

          for ID in $FINISHED_IDS; do
            # skip if already cached
            if jq -e ".\"$ID\"" match-events.json > /dev/null 2>&1; then
              echo "Match $ID already in events cache — skipping"
              continue
            fi

            echo "Fetching event detail for match $ID..."
            sleep 7   # 10 calls/min limit → ~8.6 s safe interval

            MHTTP=$(curl -s -w '%{http_code}' -o "match-${ID}.json" \
              -H "X-Auth-Token: $FD_KEY" \
              "https://api.football-data.org/v4/matches/${ID}")

            if [ "$MHTTP" = "200" ]; then
              GOALS=$(jq '.goals // []'    "match-${ID}.json")
              BOOKINGS=$(jq '.bookings // []' "match-${ID}.json")
              jq --argjson g "$GOALS" --argjson b "$BOOKINGS" \
                ". + {\"${ID}\": {\"goals\": \$g, \"bookings\": \$b}}" \
                match-events.json > tmp-events.json \
                && mv tmp-events.json match-events.json
              echo "  → goals=$(echo "$GOALS" | jq length)  bookings=$(echo "$BOOKINGS" | jq length)"
            else
              echo "  WARNING: could not fetch match $ID (HTTP $MHTTP)"
            fi

            rm -f "match-${ID}.json"
          done

          # ── 4. Merge events cache into the bulk response → live-scores.json
          jq --slurpfile ev match-events.json \
            '.matches = [.matches[] |
              . + ($ev[0][(.id | tostring)] // {})]' \
            all-matches.json > live-scores.json

          TOTAL=$(jq '.matches | length' live-scores.json)
          DONE=$(jq '[.matches[] | select(.status == "FINISHED")] | length' live-scores.json)
          GOALS_TOTAL=$(jq '[.matches[] | (.goals // []) | length] | add // 0' live-scores.json)
          echo "live-scores.json written — $TOTAL matches, $DONE finished, $GOALS_TOTAL total goals"
          rm -f all-matches.json

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-scores.json match-events.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update live scores + events [skip ci]"
            git push
          fi
