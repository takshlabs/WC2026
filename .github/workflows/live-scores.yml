name: Update Live Scores

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # ── Step 1: bulk match scores from football-data.org ─────────────────────
      - name: Fetch bulk matches from football-data.org
        env:
          FD_KEY: ${{ secrets.VITE_FOOTBALL_DATA_KEY }}
        run: |
          HTTP=$(curl -s -w '%{http_code}' -o all-matches.json \
            -H "X-Auth-Token: $FD_KEY" \
            "https://api.football-data.org/v4/competitions/2000/matches")
          echo "Bulk matches API → HTTP $HTTP"

          if [ "$HTTP" != "200" ]; then
            echo "WARNING: API returned $HTTP — preserving existing live-scores.json"
            rm -f all-matches.json
            [ -f live-scores.json ] || echo '{"matches":[]}' > live-scores.json
            exit 0
          fi

          TOTAL=$(jq '.matches | length' all-matches.json)
          DONE=$(jq '[.matches[] | select(.status == "FINISHED")] | length' all-matches.json)
          echo "all-matches.json: $TOTAL matches, $DONE finished"

      # ── Step 2: match events (goals + cards) from ESPN ───────────────────────
      # football-data.org free tier returns empty goals/bookings arrays.
      # ESPN's unofficial API (site.api.espn.com) returns full incident data,
      # has no Cloudflare protection, and works from GitHub Actions server IPs.
      - name: Install Python deps
        run: pip install requests -q

      - name: Fetch match events from ESPN
        run: |
          python3 << 'PYEOF'
          import requests, json, re, time, os, sys

          ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world'

          def norm(s):
            return re.sub(r'[^a-z]', '', (s or '').lower())

          def parse_minute(clock_str):
            m = re.match(r"(\d+)['\"]?\+(\d+)", clock_str or '')
            if m: return int(m.group(1)), int(m.group(2))
            m = re.match(r"(\d+)", clock_str or '')
            if m: return int(m.group(1)), None
            return 0, None

          def espn_get(path, params=None):
            r = requests.get(f'{ESPN}/{path}', params=params, timeout=20)
            r.raise_for_status()
            return r.json()

          if not os.path.exists('all-matches.json'):
            print('No all-matches.json — skipping')
            raise SystemExit(0)

          with open('all-matches.json') as f:
            bulk = json.load(f)

          try:
            with open('match-events.json') as f:
              cache = json.load(f)
          except Exception:
            cache = {}

          need = [
            m for m in bulk.get('matches', [])
            if m.get('status') == 'FINISHED' and str(m['id']) not in cache
          ]
          print(f'Finished matches needing events: {len(need)}')
          if not need:
            print('All cached — done')
            raise SystemExit(0)

          # Unique dates for needed matches (ESPN uses YYYYMMDD)
          need_dates = sorted({m['utcDate'][:10].replace('-','') for m in need if m.get('utcDate')})
          print(f'Fetching ESPN scoreboard for dates: {need_dates}')

          # Build ESPN event map: norm(home)_norm(away) → espn_event_id
          espn_map = {}
          for date_str in need_dates:
            try:
              data = espn_get('scoreboard', params={'dates': date_str})
              for event in data.get('events', []):
                comps = event.get('competitions', [{}])[0]
                competitors = comps.get('competitors', [])
                home = next((c['team']['displayName'] for c in competitors if c.get('homeAway') == 'home'), '')
                away = next((c['team']['displayName'] for c in competitors if c.get('homeAway') == 'away'), '')
                if home and away:
                  espn_map[f'{norm(home)}_{norm(away)}'] = event['id']
              time.sleep(0.5)
            except Exception as e:
              print(f'WARNING: ESPN scoreboard {date_str}: {e}', file=sys.stderr)

          print(f'ESPN events indexed: {len(espn_map)}')

          # Fetch summary (goals + cards) for each uncached match
          for m in need:
            mid    = str(m['id'])
            ht     = m.get('homeTeam', {})
            at_    = m.get('awayTeam', {})
            h_id   = ht.get('id')
            a_id   = at_.get('id')
            h_name = ht.get('name', '')
            a_name = at_.get('name', '')
            key    = f'{norm(h_name)}_{norm(a_name)}'
            espn_id = espn_map.get(key)

            if not espn_id:
              print(f'  [{mid}] {h_name} vs {a_name} — not in ESPN (key={key})')
              cache[mid] = {'goals': [], 'bookings': []}
              continue

            try:
              time.sleep(1)
              summary = espn_get('summary', params={'event': espn_id})

              # First pass — build assist map keyed by (homeAway, minute_str)
              assist_map = {}
              for team_data in summary.get('rosters', []):
                ha = team_data.get('homeAway', 'home')
                for player in team_data.get('roster', []):
                  pname = player.get('athlete', {}).get('displayName', '')
                  for play in player.get('plays', []):
                    if play.get('didAssist'):
                      mstr = play.get('clock', {}).get('displayValue', '')
                      assist_map[(ha, mstr)] = pname

              goals    = []
              bookings = []

              for team_data in summary.get('rosters', []):
                ha      = team_data.get('homeAway', 'home')
                team_id = h_id if ha == 'home' else a_id
                for player in team_data.get('roster', []):
                  pname = player.get('athlete', {}).get('displayName', '')
                  for play in player.get('plays', []):
                    mstr   = play.get('clock', {}).get('displayValue', '')
                    minute, inj = parse_minute(mstr)

                    if play.get('scoringPlay'):
                      assist_name = assist_map.get((ha, mstr))
                      goals.append({
                        'minute':     minute,
                        'injuryTime': inj,
                        'type':  'OWN_GOAL' if play.get('ownGoal') else 'PENALTY' if play.get('penaltyKick') else 'REGULAR',
                        'scorer': {'name': pname, 'shortName': pname},
                        'assist': {'name': assist_name, 'shortName': assist_name} if assist_name else None,
                        'team':   {'id': team_id},
                      })

                    # Cards — check yellow+red combo (second yellow) first
                    if play.get('yellowCard') or play.get('redCard'):
                      if play.get('yellowCard') and play.get('redCard'):
                        card = 'YELLOW_RED_CARD'
                      elif play.get('redCard'):
                        card = 'RED_CARD'
                      else:
                        card = 'YELLOW_CARD'
                      bookings.append({
                        'minute': minute,
                        'player': {'name': pname, 'shortName': pname},
                        'card':   card,
                        'team':   {'id': team_id},
                      })

              goals.sort(key=lambda g: g['minute'])
              bookings.sort(key=lambda b: b['minute'])
              cache[mid] = {'goals': goals, 'bookings': bookings}
              print(f'  [{mid}] {h_name} vs {a_name}: {len(goals)} goals, {len(bookings)} cards')

            except Exception as e:
              print(f'  WARNING [{mid}] {h_name} vs {a_name}: {e}', file=sys.stderr)
              cache[mid] = {'goals': [], 'bookings': []}

          with open('match-events.json', 'w') as f:
            json.dump(cache, f, indent=2)
          print(f'match-events.json — {len(cache)} entries')
          PYEOF

      # ── Step 3: merge events into live-scores.json ───────────────────────────
      - name: Merge events into live-scores.json
        run: |
          python3 << 'PYEOF'
          import json, os
          if not os.path.exists('all-matches.json'):
            raise SystemExit(0)
          with open('all-matches.json') as f:
            bulk = json.load(f)
          with open('match-events.json') as f:
            cache = json.load(f)
          goal_total = 0
          for m in bulk.get('matches', []):
            ev = cache.get(str(m['id']), {})
            m['goals']    = ev.get('goals', [])
            m['bookings'] = ev.get('bookings', [])
            goal_total += len(m['goals'])
          with open('live-scores.json', 'w') as f:
            json.dump(bulk, f)
          total = len(bulk['matches'])
          done  = sum(1 for m in bulk['matches'] if m.get('status') == 'FINISHED')
          print(f'live-scores.json — {total} matches, {done} finished, {goal_total} goals')
          os.remove('all-matches.json')
          PYEOF

      # ── Step 4: commit ────────────────────────────────────────────────────────
      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-scores.json match-events.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update live scores + events [skip ci]"
            git push
          fi
