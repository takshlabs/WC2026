name: Scrape WC2026 Stats

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:           # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install Python deps
        run: pip install requests beautifulsoup4 lxml -q

      - name: Scrape FBRef WC2026 stats
        run: |
          python3 << 'PYEOF'
          import requests, json, re, time, sys
          from datetime import datetime
          from bs4 import BeautifulSoup, Comment

          HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
            'Accept-Language': 'en-US,en;q=0.9',
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Cache-Control': 'no-cache',
          }

          def fetch(url):
            r = requests.get(url, headers=HEADERS, timeout=30)
            r.raise_for_status()
            return r.text

          def uncomment_soup(html):
            """Parse HTML and surface any tables hidden inside HTML comments (FBRef lazy loading)."""
            soup = BeautifulSoup(html, 'lxml')
            for comment in soup.find_all(string=lambda t: isinstance(t, Comment)):
              inner = BeautifulSoup(str(comment), 'lxml')
              if inner.find('table'):
                comment.replace_with(inner)
            return soup

          def stat(row, name):
            cell = row.find(['td', 'th'], {'data-stat': name})
            return cell.get_text(strip=True) if cell else ''

          def numstat(row, name):
            v = stat(row, name)
            try: return int(v)
            except:
              try: return float(v)
              except: return 0

          # ── 1. Player standard stats ──────────────────────────────────────────
          players = []
          try:
            print('Fetching player stats...')
            html = fetch('https://fbref.com/en/comps/1/stats/FIFA-World-Cup-Stats')
            soup = uncomment_soup(html)
            table = soup.find('table', id=re.compile(r'stats_standard'))
            if table:
              for row in table.find('tbody').find_all('tr'):
                classes = row.get('class') or []
                if any(c in classes for c in ('thead', 'spacer', 'partial_table')):
                  continue
                name = stat(row, 'player')
                if not name:
                  continue
                players.append({
                  'name':    name,
                  'team':    stat(row, 'team'),
                  'pos':     stat(row, 'position'),
                  'mp':      numstat(row, 'games'),
                  'goals':   numstat(row, 'goals'),
                  'assists': numstat(row, 'assists'),
                  'yc':      numstat(row, 'yellow_cards'),
                  'rc':      numstat(row, 'red_cards'),
                })
              players.sort(key=lambda x: (x['goals'], x['assists']), reverse=True)
              print(f'  → {len(players)} players scraped')
            else:
              print('  WARNING: standard stats table not found', file=sys.stderr)
            time.sleep(6)
          except Exception as e:
            print(f'  ERROR player stats: {e}', file=sys.stderr)

          # ── 2. Team / squad stats ─────────────────────────────────────────────
          team_stats = []
          try:
            print('Fetching team stats...')
            html2 = fetch('https://fbref.com/en/comps/1/FIFA-World-Cup-Stats')
            soup2 = uncomment_soup(html2)
            # Try squad standard stats table (for/against)
            sq_table = (
              soup2.find('table', id=re.compile(r'stats_squads_standard_for')) or
              soup2.find('table', id=re.compile(r'stats_squads_standard'))     or
              soup2.find('table', id=re.compile(r'stats_squads'))
            )
            if sq_table:
              for row in sq_table.find('tbody').find_all('tr'):
                classes = row.get('class') or []
                if any(c in classes for c in ('thead', 'spacer', 'partial_table')):
                  continue
                squad = stat(row, 'team') or stat(row, 'squad')
                if not squad:
                  continue
                team_stats.append({
                  'name':    squad,
                  'mp':      numstat(row, 'games'),
                  'goals':   numstat(row, 'goals'),
                  'assists': numstat(row, 'assists'),
                  'shots':   numstat(row, 'shots'),
                  'sot':     numstat(row, 'shots_on_target'),
                  'xg':      numstat(row, 'xg'),
                })
              team_stats.sort(key=lambda x: (x['goals'], x['shots']), reverse=True)
              print(f'  → {len(team_stats)} teams scraped')
            else:
              print('  WARNING: squad stats table not found', file=sys.stderr)
          except Exception as e:
            print(f'  ERROR team stats: {e}', file=sys.stderr)

          # ── 3. Write output ───────────────────────────────────────────────────
          data = {
            'updated':    datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
            'source':     'fbref.com',
            'topScorers': players[:25],
            'teamStats':  team_stats[:32],
          }

          with open('wc2026-stats.json', 'w') as f:
            json.dump(data, f, indent=2)

          print(f'wc2026-stats.json written — {len(players)} players, {len(team_stats)} teams')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wc2026-stats.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update WC2026 stats [skip ci]"
            git push
          fi
