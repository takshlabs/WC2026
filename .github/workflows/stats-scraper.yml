name: Compute WC2026 Stats

on:
  schedule:
    - cron: '15 */6 * * *'    # every 6 hours (offset from live-scores cron)
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Live Scores"]
    types: [completed]

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install Python deps
        run: pip install requests -q

      - name: Build wc2026-stats.json
        run: |
          python3 << 'PYEOF'
          import requests, json, time, sys
          from datetime import datetime

          # ── 1. Team stats — computed from live-scores.json (always reliable) ──
          team_stats = {}

          def ensure_team(tla, name):
              if tla not in team_stats:
                  team_stats[tla] = {'tla': tla, 'name': name, 'mp': 0, 'w': 0, 'd': 0, 'l': 0, 'gf': 0, 'ga': 0}
              return team_stats[tla]

          try:
              with open('live-scores.json') as f:
                  raw = json.load(f)
              for m in raw.get('matches', []):
                  if m.get('status') not in ('FINISHED',):
                      continue
                  ht = m.get('homeTeam', {})
                  at = m.get('awayTeam', {})
                  h_tla  = ht.get('tla') or ht.get('shortName', '?')
                  a_tla  = at.get('tla') or at.get('shortName', '?')
                  h_name = ht.get('name', h_tla)
                  a_name = at.get('name', a_tla)
                  ft = (m.get('score') or {}).get('fullTime') or {}
                  hg = ft.get('home') or 0
                  ag = ft.get('away') or 0
                  winner = (m.get('score') or {}).get('winner', '')

                  h = ensure_team(h_tla, h_name)
                  a = ensure_team(a_tla, a_name)
                  h['mp'] += 1;  a['mp'] += 1
                  h['gf'] += hg; h['ga'] += ag
                  a['gf'] += ag; a['ga'] += hg
                  if winner == 'HOME_TEAM': h['w'] += 1; a['l'] += 1
                  elif winner == 'AWAY_TEAM': a['w'] += 1; h['l'] += 1
                  else: h['d'] += 1; a['d'] += 1

              print(f'Team stats: {len(team_stats)} teams from live-scores.json')
          except Exception as e:
              print(f'WARNING team stats: {e}', file=sys.stderr)

          team_list = sorted(team_stats.values(), key=lambda t: (t['gf'], t['w']), reverse=True)

          # ── 2. Player stats — Sofascore unofficial API ────────────────────────
          players = []
          source  = 'live-scores.json'

          SS_HDR = {
              'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
              'Referer':    'https://www.sofascore.com/',
              'Accept':     'application/json, text/plain, */*',
              'Accept-Language': 'en-US,en;q=0.9',
              'Origin':     'https://www.sofascore.com',
          }
          SS = 'https://api.sofascore.com/api/v1'

          def ss_get(path):
              r = requests.get(f'{SS}{path}', headers=SS_HDR, timeout=20)
              r.raise_for_status()
              return r.json()

          try:
              # Discover current WC 2026 season ID
              seasons_data = ss_get('/unique-tournament/16/seasons')
              seasons = seasons_data.get('seasons', [])
              # Take the season with highest year (most recent = WC 2026)
              season = max(seasons, key=lambda s: s.get('year', 0) or int(str(s.get('name', '0'))[:4] or 0))
              season_id = season['id']
              print(f'Sofascore WC season id={season_id}  name={season.get("name")}')
              time.sleep(1)

              # Top scorers
              goals_data = ss_get(f'/unique-tournament/16/season/{season_id}/top-players/goals')
              seen = {}
              for item in goals_data.get('topPlayers', []):
                  p = item.get('player', {})
                  s = item.get('statistics', {})
                  name = p.get('name') or p.get('shortName', '')
                  if not name: continue
                  team = p.get('team', {}).get('name', '')
                  seen[name] = {
                      'name':    name,
                      'team':    team,
                      'pos':     p.get('position', ''),
                      'mp':      s.get('appearances', 0),
                      'goals':   s.get('goals', 0),
                      'assists': s.get('goalAssist', 0),
                      'yc':      s.get('yellowCards', 0),
                      'rc':      s.get('redCards', 0),
                  }
              time.sleep(1)

              # Top assisters — merge in assist counts for players not yet in list
              assists_data = ss_get(f'/unique-tournament/16/season/{season_id}/top-players/goalAssist')
              for item in assists_data.get('topPlayers', []):
                  p = item.get('player', {})
                  s = item.get('statistics', {})
                  name = p.get('name') or p.get('shortName', '')
                  if not name: continue
                  if name in seen:
                      seen[name]['assists'] = max(seen[name]['assists'], s.get('goalAssist', 0))
                  else:
                      seen[name] = {
                          'name':    name,
                          'team':    p.get('team', {}).get('name', ''),
                          'pos':     p.get('position', ''),
                          'mp':      s.get('appearances', 0),
                          'goals':   s.get('goals', 0),
                          'assists': s.get('goalAssist', 0),
                          'yc':      s.get('yellowCards', 0),
                          'rc':      s.get('redCards', 0),
                      }

              players = sorted(seen.values(), key=lambda x: (x['goals'], x['assists']), reverse=True)
              source  = 'sofascore.com'
              print(f'Player stats: {len(players)} players from Sofascore')

          except Exception as e:
              print(f'WARNING Sofascore failed: {e}', file=sys.stderr)
              print('Player stats will be empty this run.', file=sys.stderr)

          # ── 3. Write output ───────────────────────────────────────────────────
          result = {
              'updated':    datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'source':     source,
              'topScorers': players[:25],
              'teamStats':  team_list[:32],
          }

          with open('wc2026-stats.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f'wc2026-stats.json written — {len(players)} players, {len(team_list)} teams')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wc2026-stats.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update WC2026 stats [skip ci]"
            git push
          fi
