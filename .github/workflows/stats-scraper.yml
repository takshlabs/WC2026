name: Compute WC2026 Stats

on:
  schedule:
    - cron: '15 */6 * * *'    # every 6 hours (offset from live-scores cron)
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Live Scores"]
    types: [completed]

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Build wc2026-stats.json
        run: |
          python3 << 'PYEOF'
          import json, sys, os
          from datetime import datetime

          # ── 1. Team stats — computed from live-scores.json (always reliable) ──
          team_stats = {}

          def ensure_team(tla, name):
              if tla not in team_stats:
                  team_stats[tla] = {'tla': tla, 'name': name, 'mp': 0, 'w': 0, 'd': 0, 'l': 0, 'gf': 0, 'ga': 0}
              return team_stats[tla]

          raw = None
          try:
              with open('live-scores.json') as f:
                  raw = json.load(f)
              for m in raw.get('matches', []):
                  if m.get('status') not in ('FINISHED',):
                      continue
                  ht = m.get('homeTeam', {})
                  at = m.get('awayTeam', {})
                  h_tla  = ht.get('tla') or ht.get('shortName', '?')
                  a_tla  = at.get('tla') or at.get('shortName', '?')
                  h_name = ht.get('name', h_tla)
                  a_name = at.get('name', a_tla)
                  ft = (m.get('score') or {}).get('fullTime') or {}
                  hg = ft.get('home') or 0
                  ag = ft.get('away') or 0
                  winner = (m.get('score') or {}).get('winner', '')

                  h = ensure_team(h_tla, h_name)
                  a = ensure_team(a_tla, a_name)
                  h['mp'] += 1;  a['mp'] += 1
                  h['gf'] += hg; h['ga'] += ag
                  a['gf'] += ag; a['ga'] += hg
                  if winner == 'HOME_TEAM': h['w'] += 1; a['l'] += 1
                  elif winner == 'AWAY_TEAM': a['w'] += 1; h['l'] += 1
                  else: h['d'] += 1; a['d'] += 1

              print(f'Team stats: {len(team_stats)} teams from live-scores.json')
          except Exception as e:
              print(f'WARNING team stats: {e}', file=sys.stderr)

          team_list = sorted(team_stats.values(), key=lambda t: (t['gf'], t['w']), reverse=True)

          # ── 2. Player stats — aggregated from ESPN events in live-scores.json ──
          # ESPN match events (goals + bookings) are embedded in live-scores.json
          # by the live-scores workflow (Step 3 merge). No external API needed.
          players = {}

          try:
              if raw is None:
                  with open('live-scores.json') as f:
                      raw = json.load(f)

              for m in raw.get('matches', []):
                  if m.get('status') != 'FINISHED':
                      continue

                  ht = m.get('homeTeam', {})
                  at = m.get('awayTeam', {})
                  team_names = {
                      ht.get('id'): ht.get('name', ''),
                      at.get('id'): at.get('name', ''),
                  }

                  for goal in m.get('goals', []):
                      scorer = goal.get('scorer', {})
                      s_name = scorer.get('name') or scorer.get('shortName', '')
                      if s_name:
                          tid   = goal.get('team', {}).get('id')
                          tname = team_names.get(tid, '')
                          if s_name not in players:
                              players[s_name] = {'name': s_name, 'team': tname, 'goals': 0, 'assists': 0, 'yc': 0, 'rc': 0, 'mp': 0}
                          # Own goals count in match score but not for scorer's tally
                          if goal.get('type') != 'OWN_GOAL':
                              players[s_name]['goals'] += 1

                      assist = goal.get('assist')
                      if assist:
                          a_name = assist.get('name') or assist.get('shortName', '')
                          if a_name:
                              tid   = goal.get('team', {}).get('id')
                              tname = team_names.get(tid, '')
                              if a_name not in players:
                                  players[a_name] = {'name': a_name, 'team': tname, 'goals': 0, 'assists': 0, 'yc': 0, 'rc': 0, 'mp': 0}
                              players[a_name]['assists'] += 1

                  for booking in m.get('bookings', []):
                      player = booking.get('player', {})
                      p_name = player.get('name') or player.get('shortName', '')
                      if p_name:
                          tid   = booking.get('team', {}).get('id')
                          tname = team_names.get(tid, '')
                          if p_name not in players:
                              players[p_name] = {'name': p_name, 'team': tname, 'goals': 0, 'assists': 0, 'yc': 0, 'rc': 0, 'mp': 0}
                          card = booking.get('card', '')
                          if card in ('YELLOW_RED_CARD', 'RED_CARD'):
                              players[p_name]['rc'] += 1
                          elif card == 'YELLOW_CARD':
                              players[p_name]['yc'] += 1

              players_list = sorted(players.values(), key=lambda x: (x['goals'], x['assists']), reverse=True)
              print(f'Player stats: {len(players_list)} players from live-scores.json events')

          except Exception as e:
              print(f'WARNING player stats: {e}', file=sys.stderr)
              players_list = []

          # ── 3. Write output ───────────────────────────────────────────────────
          result = {
              'updated':    datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'source':     'live-scores.json (ESPN events)',
              'topScorers': players_list[:25],
              'teamStats':  team_list[:32],
          }

          with open('wc2026-stats.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f'wc2026-stats.json written — {len(players_list)} players, {len(team_list)} teams')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wc2026-stats.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update WC2026 stats [skip ci]"
            git push
          fi
