<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial Black, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a2538"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </radialGradient>
    <clipPath id="bc">
      <circle cx="900" cy="315" r="220"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(212,168,67,0.06)" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Gold accent bar -->
  <rect x="80" y="290" width="5" height="110" rx="3" fill="#d4a843"/>

  <!-- "WORLD CUP" label -->
  <text x="108" y="350" font-size="52" font-weight="900" fill="#d4a843" letter-spacing="6" text-anchor="start" filter="url(#glow)">WORLD CUP</text>
  <!-- "2026" large -->
  <text x="108" y="430" font-size="96" font-weight="900" fill="white" letter-spacing="-2" text-anchor="start">2026</text>
  <!-- Subtitle -->
  <text x="110" y="480" font-size="22" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="3">USA · CANADA · MEXICO · 48 TEAMS</text>

  <!-- Soccer ball (right side) -->
  <circle cx="900" cy="315" r="220" fill="url(#ball)"/>
  <g clip-path="url(#bc)" fill="#d4a843">
    <!-- Centre pentagon -->
    <path d="M900,155 L974,208 L947,298 L853,298 L826,208 Z"/>
    <!-- Top arch patch -->
    <path d="M838,102 L962,102 L998,202 L974,208 L900,155 L826,208 L802,202 Z"/>
    <!-- Right patch -->
    <path d="M974,208 L998,202 L1086,270 L1080,374 L1004,408 L947,298 Z"/>
    <!-- Left patch -->
    <path d="M826,208 L802,202 L714,270 L720,374 L796,408 L853,298 Z"/>
    <!-- Bottom-right patch -->
    <path d="M947,298 L1004,408 L976,490 L900,522 L900,412 Z"/>
    <!-- Bottom-left patch -->
    <path d="M853,298 L796,408 L824,490 L900,522 L900,412 Z"/>
  </g>
  <circle cx="900" cy="315" r="220" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <!-- Glint -->
  <ellipse cx="840" cy="215" rx="50" ry="28" fill="rgba(255,255,255,0.12)" transform="rotate(-30,840,215)"/>
</svg>
